
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b0712">
  <meta name="description" content="Connect with Usmania Mall, Raja Bazar Rawalpindi.">

  <title>Usmania Mall | Raja Bazar Rawalpindi</title>

  <style>
    :root {
      --maroon: #3b0712;
      --deep-maroon: #21040b;
      --gold: #d8ad55;
      --gold-light: #f3d995;
      --cream: #fff2d5;
      --muted: #dfcba5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: grid;
      place-items: center;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at top, rgba(216,173,85,.18), transparent 48%),
        linear-gradient(145deg, #160309, var(--maroon) 55%, #170309);
    }

    .page {
      position: relative;
      width: min(100%, 480px);
      padding: 34px 24px 28px;
      text-align: center;
      border: 1px solid rgba(243,217,149,.72);
      border-radius: 28px;
      background: linear-gradient(160deg, rgba(91,15,30,.96), rgba(35,4,12,.98));
      box-shadow: 0 22px 70px rgba(0,0,0,.48),
                  inset 0 0 0 7px rgba(216,173,85,.07);
      overflow: hidden;
    }

    .page:before,
    .page:after {
      content: "✦  ❧  ✦";
      display: block;
      color: var(--gold);
      letter-spacing: 10px;
      font-size: 19px;
    }

    .crest {
      width: 86px;
      height: 86px;
      margin: 14px auto 17px;
      display: grid;
      place-items: center;
      border: 2px solid var(--gold);
      border-radius: 50%;
      color: var(--gold-light);
      font-size: 39px;
      font-weight: bold;
      box-shadow: 0 0 0 6px rgba(216,173,85,.10),
                  inset 0 0 20px rgba(216,173,85,.12);
    }

    h1 {
      margin: 0;
      color: var(--gold-light);
      font-size: clamp(32px, 8vw, 43px);
      line-height: 1.08;
      letter-spacing: .3px;
      text-shadow: 0 2px 12px rgba(0,0,0,.35);
    }

    .location {
      margin: 10px 0 7px;
      color: var(--cream);
      font-size: 19px;
      letter-spacing: 1.2px;
    }

    .ornament {
      width: 76%;
      height: 1px;
      margin: 18px auto 22px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .intro {
      margin: 0 0 21px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: .5px;
    }

    .links {
      display: grid;
      gap: 13px;
    }

    .link {
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 17px;
      text-decoration: none;
      color: var(--cream);
      text-align: left;
      border: 1px solid rgba(243,217,149,.72);
      border-radius: 15px;
      background: linear-gradient(110deg, rgba(120,30,42,.85), rgba(48,7,17,.96));
      box-shadow: 0 5px 14px rgba(0,0,0,.18),
                  inset 0 1px rgba(255,255,255,.06);
      transition: transform .16s ease, border-color .16s ease;
      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: 700;
    }

    .link:hover,
    .link:focus-visible {
      transform: translateY(-2px);
      border-color: var(--gold-light);
      background: linear-gradient(110deg, #8b2938, #4b0b1b);
      outline: none;
    }

    .icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: var(--deep-maroon);
      background: linear-gradient(145deg, var(--gold-light), var(--gold));
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: 800;
    }

    .arrow {
      margin-left: auto;
      color: var(--gold-light);
      font-size: 21px;
    }

    .footer {
      margin: 25px 0 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .footer strong {
      color: var(--gold-light);
    }

    @media (max-width: 360px) {
      .page {
        padding: 26px 16px 22px;
      }

      .link {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="crest" aria-hidden="true">U</div>

    <h1>Usmania Mall</h1>

    <p class="location">
      Raja Bazar · Rawalpindi
    </p>

    <div class="ornament"></div>

    <p class="intro">
      Connect with us on social media
    </p>

    <nav class="links" aria-label="Usmania Mall social media links">

      <!-- TIKTOK -->
      <a class="link"
         href="https://www.tiktok.com/@usmania.mall.rwp"
         target="_blank"
         rel="noopener noreferrer">
        <span class="icon">♪</span>
        <span>TikTok</span>
        <span class="arrow">↗</span>
      </a>

      <!-- INSTAGRAM -->
      <a class="link"
         href="https://www.instagram.com/usma_niamall/"
         target="_blank"
         rel="noopener noreferrer">
        <span class="icon">◎</span>
        <span>Instagram</span>
        <span class="arrow">↗</span>
      </a>

      <!-- FACEBOOK -->
      <a class="link"
         href="https://www.facebook.com/people/Usmania-Mall-Rawalpindi/61596448054733/"
         target="_blank"
         rel="noopener noreferrer">
        <span class="icon">f</span>
        <span>Facebook</span>
        <span class="arrow">↗</span>
      </a>

      <!-- WHATSAPP -->
      <a class="link"
         href="https://wa.me/9233750084090"
         target="_blank"
         rel="noopener noreferrer">
        <span class="icon">☏</span>
        <span>WhatsApp</span>
        <span class="arrow">↗</span>
      </a>

    </nav>

    <p class="footer">
      <strong>Usmania Mall</strong> · Shop with elegance
    </p>

  </main>

</body>
</html>
